<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>搜索</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="shared.css">
</head>
<body class="relative">
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="flex items-center gap-2">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#1A2332"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="5" y="2" width="3" height="10" rx="1"/><rect x="10" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#1A2332" stroke-opacity="0.35"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#1A2332"/></svg>
    </div>
  </div>

  <div class="nav-bar">
    <div class="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <span class="title">搜索</span>
    <div class="capsule-wrap"><div class="wx-capsule"><span><svg width="18" height="6" viewBox="0 0 18 6"><circle cx="3" cy="3" r="2.5" fill="#1A2332"/><circle cx="9" cy="3" r="2.5" fill="#1A2332"/><circle cx="15" cy="3" r="2.5" fill="#1A2332"/></svg></span><div class="divider"></div><span><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" stroke="#1A2332" stroke-width="1.2" fill="none"/><circle cx="8" cy="8" r="2.5" fill="#1A2332"/></svg></span></div></div>
  </div>

  <div class="page-content no-tab bg-surface">
    <!-- 搜索框 -->
    <div class="bleed-x pt-3 pb-2 bg-white">
      <div class="flex items-center gap-2 bg-surface rounded-lg px-3 h-10 border border-primary">
        <svg class="text-primary shrink-0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <span class="text-sm text-ink flex-1">机器学习</span>
        <svg class="text-faint" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <!-- 搜索历史 -->
    <div class="pt-4">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-medium text-ink">搜索历史</span>
        <span class="text-xs text-faint">清除</span>
      </div>
      <div class="flex flex-wrap gap-2">
        <span class="px-3 py-1.5 rounded-full text-xs bg-white text-muted border border-gray-100">深度学习</span>
        <span class="px-3 py-1.5 rounded-full text-xs bg-white text-muted border border-gray-100">碳中和</span>
        <span class="px-3 py-1.5 rounded-full text-xs bg-white text-muted border border-gray-100">大语言模型</span>
        <span class="px-3 py-1.5 rounded-full text-xs bg-white text-muted border border-gray-100">智慧城市</span>
      </div>
    </div>

    <!-- 搜索结果 -->
    <div class="pt-5">
      <p class="text-xs text-faint mb-3">找到 4 个相关模板</p>
      <div class="space-y-3">
        <div class="card p-3 flex gap-3">
          <div class="w-14 h-14 rounded-lg bg-blue-50 flex items-center justify-center shrink-0">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3B7CFF" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm text-ink line-clamp-2">基于<span class="text-primary font-medium">机器学习</span>的智慧城市交通流量预测</p>
            <div class="flex items-center gap-2 mt-1.5">
              <span class="text-[10px] text-faint">AI 学者</span>
              <span class="text-[10px] text-faint">·</span>
              <span class="text-[10px] text-faint">256 赞</span>
            </div>
          </div>
        </div>
        <div class="card p-3 flex gap-3">
          <div class="w-14 h-14 rounded-lg bg-teal-50 flex items-center justify-center shrink-0">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5BC0BE" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm text-ink line-clamp-2"><span class="text-primary font-medium">机器学习</span>在医疗诊断中的应用研究</p>
            <div class="flex items-center gap-2 mt-1.5">
              <span class="text-[10px] text-faint">学术小白</span>
              <span class="text-[10px] text-faint">·</span>
              <span class="text-[10px] text-faint">128 赞</span>
            </div>
          </div>
        </div>
        <div class="card p-3 flex gap-3">
          <div class="w-14 h-14 rounded-lg bg-indigo-50 flex items-center justify-center shrink-0">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm text-ink line-clamp-2">集成学习算法在金融风控中的<span class="text-primary font-medium">机器学习</span>实践</p>
            <div class="flex items-center gap-2 mt-1.5">
              <span class="text-[10px] text-faint">金融研究</span>
              <span class="text-[10px] text-faint">·</span>
              <span class="text-[10px] text-faint">92 赞</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
