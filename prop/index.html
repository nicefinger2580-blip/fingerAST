<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>指尖论文 · 小程序原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B7CFF',
            secondary: '#5BC0BE',
            surface: '#F5F7FA',
            ink: '#1A2332',
            muted: '#6B7A8F',
            faint: '#B0BEC5',
          }
        }
      }
    }
  </script>
  <style>
    body { background: #E8ECF1; }
    .phone-shell {
      width: 440px;
      background: #1A1A1A;
      border-radius: 55px;
      padding: 12px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.25), inset 0 0 0 2px #333;
    }
    .phone-screen {
      width: 416px;
      height: 904px;
      border-radius: 44px;
      overflow: hidden;
      background: #000;
      position: relative;
    }
    .phone-screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .phone-notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 37px;
      background: #1A1A1A;
      border-radius: 20px;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen p-8">
  <header class="max-w-7xl mx-auto mb-10 text-center">
    <h1 class="text-3xl font-bold text-ink mb-2">指尖论文 · 小程序原型</h1>
    <p class="text-muted text-sm">iPhone 16 Pro Max（440 × 904 逻辑像素）· HTML + Tailwind CSS</p>
  </header>

  <div class="max-w-[1600px] mx-auto grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-12 justify-items-center">

    <!-- 首页 -->
    <div class="flex flex-col items-center gap-3">
      <div class="phone-shell">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="home.html" title="首页"></iframe>
        </div>
      </div>
      <span class="text-sm font-semibold text-ink">首页 · 模板广场</span>
    </div>

    <!-- 搜索 -->
    <div class="flex flex-col items-center gap-3">
      <div class="phone-shell">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="search.html" title="搜索"></iframe>
        </div>
      </div>
      <span class="text-sm font-semibold text-ink">搜索页</span>
    </div>

    <!-- 模板详情 -->
    <div class="flex flex-col items-center gap-3">
      <div class="phone-shell">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="detail.html" title="模板详情"></iframe>
        </div>
      </div>
      <span class="text-sm font-semibold text-ink">模板详情</span>
    </div>

    <!-- 创作 -->
    <div class="flex flex-col items-center gap-3">
      <div class="phone-shell">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="create.html" title="创作"></iframe>
        </div>
      </div>
      <span class="text-sm font-semibold text-ink">创作 · 输入</span>
    </div>

    <!-- 创作-生成中 -->
    <div class="flex flex-col items-center gap-3">
      <div class="phone-shell">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="create-loading.html" title="生成中"></iframe>
        </div>
      </div>
      <span class="text-sm font-semibold text-ink">创作 · 生成中</span>
    </div>

    <!-- 创作-结果 -->
    <div class="flex flex-col items-center gap-3">
      <div class="phone-shell">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="create-result.html" title="生成结果"></iframe>
        </div>
      </div>
      <span class="text-sm font-semibold text-ink">创作 · 生成结果</span>
    </div>

    <!-- 资源 -->
    <div class="flex flex-col items-center gap-3">
      <div class="phone-shell">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="resources.html" title="资源"></iframe>
        </div>
      </div>
      <span class="text-sm font-semibold text-ink">资源</span>
    </div>

    <!-- 我的-未登录 -->
    <div class="flex flex-col items-center gap-3">
      <div class="phone-shell">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="mine-guest.html" title="我的-未登录"></iframe>
        </div>
      </div>
      <span class="text-sm font-semibold text-ink">我的 · 未登录</span>
    </div>

    <!-- 我的-已登录 -->
    <div class="flex flex-col items-center gap-3">
      <div class="phone-shell">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="mine.html" title="我的"></iframe>
        </div>
      </div>
      <span class="text-sm font-semibold text-ink">我的 · 已登录</span>
    </div>

    <!-- 创作历史 -->
    <div class="flex flex-col items-center gap-3">
      <div class="phone-shell">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="history.html" title="创作历史"></iframe>
        </div>
      </div>
      <span class="text-sm font-semibold text-ink">创作历史</span>
    </div>

    <!-- 积分明细 -->
    <div class="flex flex-col items-center gap-3">
      <div class="phone-shell">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="points.html" title="积分明细"></iframe>
        </div>
      </div>
      <span class="text-sm font-semibold text-ink">积分明细</span>
    </div>

    <!-- 签到 -->
    <div class="flex flex-col items-center gap-3">
      <div class="phone-shell">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <iframe src="signin.html" title="每日签到"></iframe>
        </div>
      </div>
      <span class="text-sm font-semibold text-ink">每日签到</span>
    </div>

  </div>

  <footer class="max-w-7xl mx-auto mt-16 pb-8 text-center text-faint text-xs">
    原型仅供设计评审 · 基于 docu/frontend.md 需求文档
  </footer>
</body>
</html>
