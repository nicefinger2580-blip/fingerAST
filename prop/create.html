      <svg width="16" height="12" viewBox="0 0 16 12" fill="#1A2332"><path d="M8 2.5C10.5 2.5 12.7 3.6 14.2 5.3L15.5 4C13.6 1.9 11 0.5 8 0.5S2.4 1.9 0.5 4L1.8 5.3C3.3 3.6 5.5 2.5 8 2.5Z"/><path d="M8 6.5C9.4 6.5 10.7 7 11.7 7.9L13 6.6C11.5 5.2 9.8 4.5 8 4.5S4.5 5.2 3 6.6L4.3 7.9C5.3 7 6.6 6.5 8 6.5Z"/><circle cx="8" cy="10.5" r="1.5"/></svg>

  <div class="nav-bar">
    <span class="title">指尖论文</span>
    <div class="capsule-wrap"><div class="wx-capsule"><span><svg width="18" height="6" viewBox="0 0 18 6"><circle cx="3" cy="3" r="2.5" fill="#1A2332"/><circle cx="9" cy="3" r="2.5" fill="#1A2332"/><circle cx="15" cy="3" r="2.5" fill="#1A2332"/></svg></span><div class="divider"></div><span><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" stroke="#1A2332" stroke-width="1.2" fill="none"/><circle cx="8" cy="8" r="2.5" fill="#1A2332"/></svg></span></div></div>
  </div>

  <div class="page-content bg-surface">
    <!-- 引导区 -->
    <div class="mt-4 p-4 card">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center shrink-0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B7CFF" stroke-width="1.5"><path d="M12 2a4 4 0 014 4c0 1.5-.8 2.8-2 3.5V11h-4V9.5C8.8 8.8 8 7.5 8 6a4 4 0 014-4z"/><path d="M9 18h6M10 22h4M12 11v4"/></svg>
        </div>
        <div>
          <p class="text-sm font-semibold text-ink">AI 智能生成论文结构</p>
          <p class="text-xs text-muted mt-1 leading-relaxed">输入论文主题或关键词，AI 将为你生成结构模板</p>
        </div>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="mt-4">
      <label class="text-sm font-medium text-ink mb-2 block">论文提示词</label>
      <div class="card p-3 relative">
        <textarea class="w-full h-32 text-sm text-ink resize-none outline-none bg-transparent leading-relaxed" placeholder="请输入论文题目、关键词或研究方向...">基于机器学习的智慧城市建设中交通流量预测模型研究</textarea>
        <span class="absolute bottom-2 right-3 text-xs text-faint">28/500</span>
      </div>
    </div>

    <!-- 示例提示词 -->
    <div class="mt-3">
      <p class="text-xs text-muted mb-2">示例提示词</p>
      <div class="flex flex-wrap gap-2">
        <span class="px-3 py-1.5 rounded-full text-xs bg-white border border-gray-200 text-muted">社会科学类</span>
        <span class="px-3 py-1.5 rounded-full text-xs bg-white border border-gray-200 text-muted">计算机类</span>
        <span class="px-3 py-1.5 rounded-full text-xs bg-white border border-gray-200 text-muted">经济管理类</span>
        <span class="px-3 py-1.5 rounded-full text-xs bg-white border border-gray-200 text-muted">医学健康类</span>
      </div>
    </div>

    <!-- 生成按钮 -->
    <div class="mt-5">
      <button class="btn-primary">开始生成</button>
      <p class="text-center text-xs text-faint mt-2">本次生成将消耗 5 积分</p>
    </div>

    <!-- 空状态占位 -->
    <div class="mt-8 flex flex-col items-center py-8">
      <div class="w-24 h-24 rounded-full bg-blue-50 flex items-center justify-center mb-4">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3B7CFF" stroke-width="1" opacity="0.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
      </div>
      <p class="text-sm text-muted">输入提示词后点击生成</p>
      <p class="text-xs text-faint mt-1">AI 将为你构建完整论文大纲</p>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>首页</span>
    </div>
    <div class="tab-item active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      <span>创作</span>
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      <span>资源</span>
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>我的</span>
