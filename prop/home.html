<!DOCTYPE html>

      <div class="flex items-center gap-2 bg-surface rounded-lg px-3 h-9">

      <div class="flex gap-2 mt-3">
        <span class="px-3 py-1 rounded-full text-xs font-medium bg-primary text-white">最新</span>
        <span class="px-3 py-1 rounded-full text-xs text-muted bg-surface">最热</span>
        <span class="px-3 py-1 rounded-full text-xs text-muted bg-surface">关注</span>

            <span class="text-[10px] text-faint">学术小白</span>

      <div class="card overflow-hidden">
        <div class="h-36 bg-gradient-to-br from-teal-50 to-cyan-50 flex items-center justify-center">

            <span class="text-[10px] text-faint">绿色研究</span>
            <div class="flex items-center gap-0.5 text-faint">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
              <span class="text-[10px]">86</span>
            </div>
          </div>
        </div>
      </div>
      <!-- 卡片3 -->
      <div class="card overflow-hidden">
        <div class="h-32 bg-gradient-to-br from-indigo-50 to-purple-50 flex items-center justify-center">

            <span class="text-[10px] text-faint">AI 学者</span>
            <div class="flex items-center gap-0.5 text-faint">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>

          </div>
        </div>
      </div>
      <!-- 卡片4 -->
      <div class="card overflow-hidden">
        <div class="h-28 bg-gradient-to-br from-amber-50 to-orange-50 flex items-center justify-center">

              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
