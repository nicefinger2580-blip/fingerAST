<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>生成中</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="shared.css">
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse-dot { 0%,80%,100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
    .spinner { animation: spin 1s linear infinite; }
    .dot { animation: pulse-dot 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>
<body class="relative">
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="flex items-center gap-2">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#1A2332"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="5" y="2" width="3" height="10" rx="1"/><rect x="10" y="0" width="3" height="12" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.3"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#1A2332"><path d="M8 2.5C10.5 2.5 12.7 3.6 14.2 5.3L15.5 4C13.6 1.9 11 0.5 8 0.5S2.4 1.9 0.5 4L1.8 5.3C3.3 3.6 5.5 2.5 8 2.5Z"/><circle cx="8" cy="10.5" r="1.5"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#1A2332" stroke-opacity="0.35"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#1A2332"/></svg>
    </div>
  </div>

  <div class="nav-bar">
    <span class="title">指尖论文</span>
    <div class="capsule-wrap"><div class="wx-capsule"><span><svg width="18" height="6" viewBox="0 0 18 6"><circle cx="3" cy="3" r="2.5" fill="#1A2332"/><circle cx="9" cy="3" r="2.5" fill="#1A2332"/><circle cx="15" cy="3" r="2.5" fill="#1A2332"/></svg></span><div class="divider"></div><span><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" stroke="#1A2332" stroke-width="1.2" fill="none"/><circle cx="8" cy="8" r="2.5" fill="#1A2332"/></svg></span></div></div>
  </div>

  <div class="page-content bg-surface">
    <div class="mt-4 p-3 card">
      <p class="text-xs text-muted line-clamp-2">基于机器学习的智慧城市建设中交通流量预测模型研究</p>
    </div>

    <div class="mt-3">
      <button class="btn-primary opacity-50 cursor-not-allowed" disabled>生成中...</button>
      <p class="text-center text-xs text-faint mt-2">本次生成将消耗 5 积分</p>
    </div>

    <!-- 加载动画 -->
    <div class="flex flex-col items-center justify-center mt-16">
      <div class="relative w-20 h-20 mb-6">
        <svg class="spinner absolute inset-0" viewBox="0 0 80 80" fill="none">
          <circle cx="40" cy="40" r="36" stroke="#EEF0F4" stroke-width="4"/>
          <circle cx="40" cy="40" r="36" stroke="#3B7CFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="80 150"/>
        </svg>
        <div class="absolute inset-0 flex items-center justify-center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3B7CFF" stroke-width="1.5"><path d="M12 2a4 4 0 014 4c0 1.5-.8 2.8-2 3.5V11h-4V9.5C8.8 8.8 8 7.5 8 6a4 4 0 014-4z"/></svg>
        </div>
      </div>
      <p class="text-base font-medium text-ink mb-2">AI 正在构思中...</p>
      <div class="flex gap-1.5 mb-4">
        <div class="dot w-2 h-2 rounded-full bg-primary"></div>
        <div class="dot w-2 h-2 rounded-full bg-primary"></div>
        <div class="dot w-2 h-2 rounded-full bg-primary"></div>
      </div>
      <p class="text-xs text-faint">预计等待 3~8 秒</p>
      <button class="mt-6 text-sm text-muted underline">取消生成</button>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>首页</span></div>
    <div class="tab-item active"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg><span>创作</span></div>
    <div class="tab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg><span>资源</span></div>
    <div class="tab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>我的</span></div>
  </div>
</body>
</html>
