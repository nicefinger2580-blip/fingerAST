<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>每日签到</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="shared.css">
</head>
<body class="relative">
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="flex items-center gap-2">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#1A2332"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="5" y="2" width="3" height="10" rx="1"/><rect x="10" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#1A2332" stroke-opacity="0.35"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#1A2332"/></svg>
    </div>
  </div>

  <div class="nav-bar">
    <div class="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <span class="title">每日签到</span>
    <div class="capsule-wrap"><div class="wx-capsule"><span><svg width="18" height="6" viewBox="0 0 18 6"><circle cx="3" cy="3" r="2.5" fill="#1A2332"/><circle cx="9" cy="3" r="2.5" fill="#1A2332"/><circle cx="15" cy="3" r="2.5" fill="#1A2332"/></svg></span><div class="divider"></div><span><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" stroke="#1A2332" stroke-width="1.2" fill="none"/><circle cx="8" cy="8" r="2.5" fill="#1A2332"/></svg></span></div></div>
  </div>

  <div class="page-content no-tab bg-surface">
    <!-- 签到统计 -->
    <div class="mt-4 card p-5 text-center">
      <p class="text-sm text-muted">已连续签到</p>
      <div class="flex items-end justify-center gap-1 my-2">
        <span class="text-5xl font-bold text-secondary">5</span>
        <span class="text-sm text-muted mb-2">天</span>
      </div>
      <p class="text-xs text-faint">连续签到 7 天额外奖励 +20 积分</p>
    </div>

    <!-- 日历 -->
    <div class="mt-4 card p-4">
      <div class="flex items-center justify-between mb-4">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0BEC5" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
        <span class="text-sm font-semibold text-ink">2025 年 6 月</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0BEC5" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <!-- 星期头 -->
      <div class="grid grid-cols-7 gap-1 mb-2">
        <span class="text-[10px] text-faint text-center">日</span>
        <span class="text-[10px] text-faint text-center">一</span>
        <span class="text-[10px] text-faint text-center">二</span>
        <span class="text-[10px] text-faint text-center">三</span>
        <span class="text-[10px] text-faint text-center">四</span>
        <span class="text-[10px] text-faint text-center">五</span>
        <span class="text-[10px] text-faint text-center">六</span>
      </div>

      <!-- 日期网格 -->
      <div class="grid grid-cols-7 gap-1">
        <!-- 空白占位 (6月1日是周日，从1开始) -->
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-ink bg-secondary/20 relative">
          <span>1</span>
          <div class="absolute bottom-0.5 w-1 h-1 rounded-full bg-secondary"></div>
        </div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-ink bg-secondary/20 relative">
          <span>2</span>
          <div class="absolute bottom-0.5 w-1 h-1 rounded-full bg-secondary"></div>
        </div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-ink bg-secondary/20 relative">
          <span>3</span>
          <div class="absolute bottom-0.5 w-1 h-1 rounded-full bg-secondary"></div>
        </div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">4</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">5</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">6</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">7</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">8</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">9</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">10</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">11</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">12</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">13</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">14</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">15</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">16</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">17</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">18</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-ink bg-secondary/20 relative">
          <span>19</span>
          <div class="absolute bottom-0.5 w-1 h-1 rounded-full bg-secondary"></div>
        </div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-ink bg-secondary/20 relative">
          <span>20</span>
          <div class="absolute bottom-0.5 w-1 h-1 rounded-full bg-secondary"></div>
        </div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-ink bg-secondary/20 relative">
          <span>21</span>
          <div class="absolute bottom-0.5 w-1 h-1 rounded-full bg-secondary"></div>
        </div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-ink bg-secondary/20 relative">
          <span>22</span>
          <div class="absolute bottom-0.5 w-1 h-1 rounded-full bg-secondary"></div>
        </div>
        <!-- 今天 23 -->
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-white bg-primary font-semibold ring-2 ring-primary/30">
          23
        </div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">24</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">25</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">26</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">27</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">28</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">29</div>
        <div class="aspect-square flex items-center justify-center rounded-full text-xs text-muted">30</div>
      </div>
    </div>

    <!-- 签到按钮 -->
    <div class="mt-5">
      <button class="btn-primary">签到 +10 积分</button>
    </div>

    <!-- 签到成功 Toast 示意 -->
    <div class="mt-4 flex justify-center">
      <div class="inline-flex items-center gap-2 bg-black/75 text-white text-xs px-4 py-2 rounded-full">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#52C41A" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        签到成功，获得 10 积分
      </div>
    </div>

    <!-- 签到规则 -->
    <div class="mt-5 card p-4">
      <p class="text-sm font-medium text-ink mb-2">签到规则</p>
      <ul class="text-xs text-muted space-y-1.5 leading-relaxed">
        <li>· 每日签到可获得 10 积分</li>
        <li>· 连续签到 7 天额外奖励 20 积分</li>
        <li>· 积分可用于 AI 生成和 docx 导出</li>
        <li>· 每日仅可签到一次，不可补签</li>
      </ul>
    </div>
  </div>
</body>
</html>
