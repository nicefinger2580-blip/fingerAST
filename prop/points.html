<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>积分明细</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="shared.css">
</head>
<body class="relative">
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="flex items-center gap-2">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#1A2332"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="5" y="2" width="3" height="10" rx="1"/><rect x="10" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#1A2332" stroke-opacity="0.35"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#1A2332"/></svg>
    </div>
  </div>

  <div class="nav-bar">
    <div class="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <span class="title">积分明细</span>
    <div class="capsule-wrap"><div class="wx-capsule"><span><svg width="18" height="6" viewBox="0 0 18 6"><circle cx="3" cy="3" r="2.5" fill="#1A2332"/><circle cx="9" cy="3" r="2.5" fill="#1A2332"/><circle cx="15" cy="3" r="2.5" fill="#1A2332"/></svg></span><div class="divider"></div><span><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" stroke="#1A2332" stroke-width="1.2" fill="none"/><circle cx="8" cy="8" r="2.5" fill="#1A2332"/></svg></span></div></div>
  </div>

  <div class="page-content no-tab bg-surface">
    <!-- 积分总览 -->
    <div class="bg-gradient-to-br from-primary to-blue-600 mt-4 rounded-xl p-5 text-white">
      <p class="text-xs opacity-80">当前积分余额</p>
      <div class="flex items-end gap-1 mt-1">
        <span class="text-4xl font-bold">120</span>
        <span class="text-sm opacity-80 mb-1.5">积分</span>
      </div>
      <div class="flex gap-6 mt-4 pt-4 border-t border-white/20">
        <div>
          <p class="text-lg font-semibold">+80</p>
          <p class="text-[10px] opacity-70">累计获取</p>
        </div>
        <div>
          <p class="text-lg font-semibold">-60</p>
          <p class="text-[10px] opacity-70">累计消耗</p>
        </div>
      </div>
    </div>

    <!-- Tab 切换 -->
    <div class="mt-4 flex bg-white rounded-lg p-1 card">
      <div class="flex-1 text-center py-2 rounded-md bg-primary text-white text-sm font-medium">获取记录</div>
      <div class="flex-1 text-center py-2 text-sm text-muted">消耗记录</div>
    </div>

    <!-- 记录列表 -->
    <div class="pt-3 pb-4 space-y-2">
      <div class="card px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-teal-50 flex items-center justify-center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5BC0BE" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
          <div>
            <p class="text-sm text-ink">每日签到</p>
            <p class="text-[10px] text-faint">2025-06-23 08:30</p>
          </div>
        </div>
        <span class="text-sm font-semibold text-green-500">+10</span>
      </div>

      <div class="card px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-teal-50 flex items-center justify-center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5BC0BE" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
          <div>
            <p class="text-sm text-ink">每日签到</p>
            <p class="text-[10px] text-faint">2025-06-22 09:12</p>
          </div>
        </div>
        <span class="text-sm font-semibold text-green-500">+10</span>
      </div>

      <div class="card px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-blue-50 flex items-center justify-center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B7CFF" stroke-width="1.5"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>
          </div>
          <div>
            <p class="text-sm text-ink">新用户注册奖励</p>
            <p class="text-[10px] text-faint">2025-06-18 10:00</p>
          </div>
        </div>
        <span class="text-sm font-semibold text-green-500">+50</span>
      </div>

      <div class="card px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-teal-50 flex items-center justify-center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5BC0BE" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
          <div>
            <p class="text-sm text-ink">每日签到</p>
            <p class="text-[10px] text-faint">2025-06-21 08:45</p>
          </div>
        </div>
        <span class="text-sm font-semibold text-green-500">+10</span>
      </div>
    </div>
  </div>
</body>
</html>
